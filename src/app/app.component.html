<div class="app-container">
  <div class="glass-card">
    <h1>Surprise Clock</h1>
    
    <div class="button-group">
      <button 
        class="action-btn surprise-btn" 
        (click)="onSurpriseClick()"
        aria-label="Show surprise message"
      >
        ✨ Surprise
      </button>
      
      <button 
        class="action-btn datetime-btn" 
        (click)="onShowDateTime()"
        aria-label="Show current date and time"
      >
        🕐 Show Current Date & Time
      </button>
    </div>
    
    <div class="output-area" aria-live="polite" aria-atomic="true">
      <div *ngIf="showSurprise" class="surprise-text">
        SURPRISE! 🎉
      </div>
      
      <div *ngIf="currentDateTime" class="datetime-text">
        {{ currentDateTime }}
      </div>
    </div>
  </div>
</div>
